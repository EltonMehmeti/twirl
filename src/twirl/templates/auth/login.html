{% extends "base.html" %}
{% block container_class %} v-container--narrow{% endblock %}
{% block content %}
<div class="v-eyebrow">{{ brand }}</div>
<h1>{{ _("Shop login") }}</h1>
<div class="v-auth">
  {% if error %}<p class="error" role="alert">{{ _(error) }}</p>{% endif %}
  <form method="post" action="/login/email">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>{{ _("Email") }} <input type="email" name="email" required autocomplete="username"></label>
    <label>{{ _("Password") }} <input type="password" name="password" required autocomplete="current-password"></label>
    <button>{{ _("Log in") }}</button>
  </form>
  <div class="v-auth-links">
    <a href="/login/telefoni">{{ _("Log in with your phone number") }}</a>
    <a href="/listo">{{ _("New here? List your clothes") }}</a>
  </div>
</div>
{% endblock %}
