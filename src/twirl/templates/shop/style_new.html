{% extends "shop/base.html" %}
{% block container_class %} v-container--narrow{% endblock %}
{% block content %}
<p class="v-crumb"><a href="/shop/styles">← {{ _("All dresses") }}</a></p>
<h1>{{ _("New dress") }}</h1>
<form method="post" action="/shop/styles/new" class="v-surface">
  <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
  {% include "shop/_style_fields.html" %}
  <button>{{ _("Create") }}</button>
</form>
{% endblock %}
