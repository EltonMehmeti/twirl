[project]
name = "twirl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic-settings>=2.4",
  "jinja2>=3.1",
  "python-multipart>=0.0.9",
  "itsdangerous>=2.2",
  "argon2-cffi>=23.1",
  "pillow>=10.4",
  "babel>=2.16",
  "apscheduler>=3.10,<4",
  "httpx>=0.27",
  "sqladmin>=0.19",
  "phonenumbers>=8.13",
  "segno>=1.6",
  "tzdata>=2024.1",
  "greenlet>=3.5.6",
  "boto3>=1.43.103",
]

[project.scripts]
twirl = "twirl.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/twirl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI dependencies are declared as argument defaults by design.
ignore = ["B008"]
