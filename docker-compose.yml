services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: twirl
      POSTGRES_PASSWORD: twirl
      POSTGRES_DB: twirl
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
volumes:
  pgdata:
